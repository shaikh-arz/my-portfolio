<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
}

.contact-container{

    width:100%;
    max-width:500px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);

}

.contact-container h1{

    text-align:center;
    color:#4f46e5;
    margin-bottom:10px;

}

.contact-container p{

    text-align:center;
    color:#666;
    margin-bottom:30px;

}

.input-group{

    margin-bottom:20px;

}

.input-group label{

    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;

}

.input-group input,
.input-group textarea{

    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.3s;

}

.input-group input:focus,
.input-group textarea:focus{

    border-color:#4f46e5;
    box-shadow:0 0 8px rgba(79,70,229,.2);

}

textarea{

    resize:none;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(79,70,229,.3);

}

.back{

    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#4f46e5;
    font-weight:600;

}

.back:hover{

    text-decoration:underline;

}
/* Custom Cursor */

body {
    cursor: none;
}

.custom-cursor {
    position: fixed;
    width: 20px;
    height: 20px;

    border: 2px solid #00cfff;
    border-radius: 50%;

    pointer-events: none;

    transform: translate(-50%, -50%);

    z-index: 9999;

    transition:
        width 0.2s ease,
        height 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.custom-cursor.hover {
    width: 40px;
    height: 40px;

    background: rgba(0, 207, 255, 0.15);

    box-shadow: 0 0 20px #00cfff;
}
</style>

</head>
<div class="custom-cursor"></div>

<script>
    const cursor = document.querySelector(".custom-cursor");

    document.addEventListener("mousemove", function(e) {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    });

    const hoverElements = document.querySelectorAll(
        "a, button, img, .card, .skill"
    );

    hoverElements.forEach(element => {

        element.addEventListener("mouseenter", () => {
            cursor.classList.add("hover");
        });

        element.addEventListener("mouseleave", () => {
            cursor.classList.remove("hover");
        });

    });
</script>
<body>

<div class="contact-container">

<h1>Contact Me</h1>

<p>I'd love to hear from you. Fill out the form below.</p>

<form action="https://formspree.io/f/xrpzbnjq" method="POST">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Enter your name"
required>

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Subject</label>

<input
type="text"
name="subject"
placeholder="Subject"
required>

</div>

<div class="input-group">

<label>Your Message</label>

<textarea
name="message"
rows="6"
placeholder="Write your message..."
required></textarea>

</div>

<button type="submit">
Send Message
</button>

</form>

<a href="frontend.html" class="back">← Back to Portfolio</a>

</div>

</body>
</html>
